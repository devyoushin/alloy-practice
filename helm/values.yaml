# Grafana Alloy Helm Values (개발/테스트용)
# helm install alloy grafana/alloy --namespace monitoring --values values.yaml

## 배포 방식 (DaemonSet: 로그 수집, Deployment: 메트릭 수집)
controller:
  type: daemonset

## 서비스 어카운트 (RBAC 자동 생성)
serviceAccount:
  create: true
  name: alloy

## ClusterRole (Kubernetes API 접근 권한)
rbac:
  create: true

## 이미지 설정
image:
  repository: grafana/alloy
  pullPolicy: IfNotPresent
  # tag는 chart 기본값 사용

## 서비스 설정
service:
  type: ClusterIP
  port: 12345

## 리소스 설정 (개발/테스트용 최소값)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

## 스토리지 설정 (WAL, positions 파일)
extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

## Alloy 설정 (config.alloy)
alloy:
  configMap:
    create: true
    content: |
      // ============================================
      // 로깅 설정
      // ============================================
      logging {
        level  = "info"
        format = "logfmt"
      }

      // ============================================
      // 메트릭 파이프라인
      // ============================================
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }

        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      prometheus.scrape "pods" {
        targets         = discovery.relabel.pods.output
        forward_to      = [prometheus.remote_write.mimir.receiver]
        scrape_interval = "30s"
        job_name        = "kubernetes-pods"
      }

      prometheus.remote_write "mimir" {
        endpoint {
          // TODO: Mimir 엔드포인트로 변경
          url = "http://mimir-nginx.monitoring.svc.cluster.local:8080/api/v1/push"

          headers = {
            "X-Scope-OrgID" = "default",
          }

          queue_config {
            capacity             = 10000
            max_shards           = 50
            max_samples_per_send = 2000
          }
        }

        external_labels = {
          cluster = "eks-dev",
          region  = "ap-northeast-2",
        }
      }

      // ============================================
      // 로그 파이프라인
      // ============================================
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          // TODO: Loki 엔드포인트로 변경
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"

          headers = {
            "X-Scope-OrgID" = "default",
          }
        }

        external_labels = {
          cluster = "eks-dev",
          region  = "ap-northeast-2",
        }
      }

      // ============================================
      // 트레이스 파이프라인
      // ============================================
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        timeout         = "5s"
        send_batch_size = 1000
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          // TODO: Tempo 엔드포인트로 변경
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
          headers = {
            "X-Scope-OrgID" = "default",
          }
        }
      }

      // ============================================
      // Alloy 자체 모니터링
      // ============================================
      prometheus.scrape "alloy_self" {
        targets = [{
          "__address__" = "localhost:12345",
          "job"         = "alloy",
        }]
        forward_to      = [prometheus.remote_write.mimir.receiver]
        scrape_interval = "15s"
      }

  ## Alloy 서버 설정
  extraArgs:
    - --server.http.listen-addr=0.0.0.0:12345
    - --stability.level=generally-available

  ## 환경 변수 (필요 시 Secret으로 주입)
  # extraEnv:
  #   - name: MIMIR_URL
  #     valueFrom:
  #       secretKeyRef:
  #         name: alloy-secrets
  #         key: mimir_url

## ServiceMonitor (Prometheus Operator 사용 시)
serviceMonitor:
  enabled: false

## Pod 설정
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "12345"
  prometheus.io/path: "/metrics"

## 보안 컨텍스트 (로그 수집 시 hostPath 접근 필요)
securityContext:
  privileged: false
  runAsUser: 0   # root 필요 (hostPath 파일 읽기)
  allowPrivilegeEscalation: false
